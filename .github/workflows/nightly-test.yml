name: Nightly Test

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-android
      # Gradle Managed Devices는 러너에 KVM이 있어야 한다.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate Baseline Profile
        run: >
          ./gradlew :app:generateReleaseBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Macrobenchmark
        # 에뮬레이터 수치로는 큰 회귀만 잡을 수 있다. 정밀한 비교는 같은 조건의 실기기에서 한다.
        run: >
          ./gradlew :benchmark:pixel6Api34BenchmarkReleaseAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            app/src/release/generated/baselineProfiles/
            benchmark/build/outputs/managed_device_android_test_additional_output/
            benchmark/build/reports/
          retention-days: 14

  instrumented:
    # 기획 문서 9.3 핵심 흐름을 9.5의 기기마다 실행한다. 기기 하나가 실패해도 나머지 결과는 끝까지 받는다.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [pixel2Api27, pixel6Api36, pixelTabletApi36, pixel6Api36PageSize16k]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on ${{ matrix.device }}
        run: >
          ./gradlew :app:${{ matrix.device }}DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-${{ matrix.device }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14

  instrumented-api26:
    # Gradle Managed Devices는 API 27부터라 최소 지원 버전(API 26)은 일반 에뮬레이터에서 같은 테스트를 돌린다.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew :app:connectedDebugAndroidTest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-api26
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14

  page-size:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-android
      # 서명 없이도 번들 구성은 같으므로 매일 네이티브 라이브러리의 16KB 정렬을 확인한다.
      - run: ./gradlew bundleRelease
      - run: scripts/check-16kb-alignment.sh app/build/outputs/bundle/release/app-release.aab
