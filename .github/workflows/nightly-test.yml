name: Nightly Test

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-android
      # Gradle Managed Devices need KVM on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate Baseline Profile
        run: >
          ./gradlew :app:generateReleaseBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Macrobenchmark
        # Emulator numbers only catch large regressions; compare like-for-like on a physical device.
        run: >
          ./gradlew :benchmark:pixel6Api34BenchmarkReleaseAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            app/src/release/generated/baselineProfiles/
            benchmark/build/outputs/managed_device_android_test_additional_output/
            benchmark/build/reports/
          retention-days: 14
